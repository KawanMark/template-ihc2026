<text x="360.0" y="587" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">O07 Relacionar região,</text>
<text x="360.0" y="611" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">comentário e conclusão</text>
<rect x="650" y="560" width="510" height="80" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="905.0" y="587" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">O08 Reconhecer limites e</text>
<text x="905.0" y="611" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">informação insuficiente</text>
<text x="600" y="682" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">O02: compartilhado pelos três cenários · O07/O08: CI02 e CI03 · Vistoria e decisão formal fora da Mesa</text></svg>
