<text x="210.0" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">O01 Examinar o caso</text>
<text x="210.0" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">com apoio visual · CI01</text>
<rect x="430" y="150" width="340" height="82" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="600.0" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">O06 Compreender o</text>
<text x="600.0" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">fundamento do parecer · CI02</text>
<rect x="820" y="150" width="340" height="82" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
