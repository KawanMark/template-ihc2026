<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Mapa consolidado de objetivos — Mesa de inspeção</title>
<desc id="desc">CI01 examina o caso; CI02 compreende o parecer; CI03 prepara informação. O02 é compartilhado pelos três. O07 e O08 são compartilhados por CI02 e CI03. A conferência física permanece fora da interface.</desc>
