<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="620" viewBox="0 0 1360 620">
  <defs>
    <style>
      .bg { fill: #fbfaf8; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #1e1e1e; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #555555; }
      .node-oval { fill: #fff3e0; stroke: #e67e22; stroke-width: 2.5; stroke-dasharray: 6,2; }
      .node-box { fill: #ffffff; stroke: #2c3e50; stroke-width: 2.2; rx: 8; }
      .node-alert { fill: #fdecea; stroke: #d93025; stroke-width: 2.4; rx: 8; }
      .node-ok { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2.4; rx: 8; }
      .node-err { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 2.2; stroke-dasharray: 5,3; rx: 8; }
      .node-diamond { fill: #fffdf9; stroke: #2c3e50; stroke-width: 2.2; }
      .node-diamond-orange { fill: #fff3e0; stroke: #e67e22; stroke-width: 2.4; }
      .badge { font-family: 'Consolas', monospace; font-size: 11px; font-weight: 700; fill: #ffffff; }
      .badge-bg { fill: #2c3e50; rx: 4; }
      .badge-err-bg { fill: #7e22ce; rx: 4; }
      .txt-main { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #1e1e1e; text-anchor: middle; }
      .txt-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #4a5568; text-anchor: middle; }
      .edge { fill: none; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrow); }
      .edge-ret { fill: none; stroke: #7e22ce; stroke-width: 1.8; stroke-dasharray: 5,4; marker-end: url(#arrow-purple); }
      .edge-lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #2c3e50; }
      .footer { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-style: italic; fill: #4a5568; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2c3e50"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7e22ce"/>
    </marker>
  </defs>

  <rect width="1360" height="620" class="bg"/>
  <rect x="12" y="12" width="1336" height="596" fill="none" stroke="#d0d7de" stroke-width="1.5" rx="10"/>

  <!-- Header -->
  <text x="36" y="46" class="title">Mesa de inspeção - fluxo de uso do inspetor e transição de estados (PF01 e PF02)</text>
  <text x="36" y="68" class="subtitle">Derivado da Página 3 ("3. Fluxo do inspetor") do arquivo editável mesa_inspecao.tldr, mapeado para os estados PP01 a PP06 e tarefas T01 a T06</text>

  <!-- Step 1: Abrir imagem (PP01) -->
  <ellipse cx="95" cy="220" rx="68" ry="42" class="node-oval"/>
  <rect x="57" y="162" width="76" height="18" class="badge-bg"/>
  <text x="95" y="175" class="badge" text-anchor="middle">Estado PP01</text>
  <text x="95" y="216" class="txt-main">Abrir imagem</text>
  <text x="95" y="234" class="txt-sub">Botão ou arrastar</text>

  <!-- Step 2: Triagem automática (PP02) -->
  <rect x="205" y="170" width="185" height="100" class="node-box"/>
  <rect x="255" y="158" width="84" height="18" class="badge-bg"/>
  <text x="297" y="171" class="badge" text-anchor="middle">Estado PP02</text>
  <text x="297" y="198" class="txt-main">Triagem automática</text>
  <text x="297" y="218" class="txt-sub">Probabilidade + mapa</text>
  <text x="297" y="235" class="txt-sub">de atenção + região</text>
  <text x="297" y="253" class="txt-sub">(R01, H31, T01-1)</text>

  <!-- Step 3: Diamond >= 70%? -->
  <polygon points="500,155 575,220 500,285 425,220" class="node-diamond"/>
  <text x="500" y="216" class="txt-main">≥ 70%?</text>
  <text x="500" y="234" class="txt-sub">(limiar 0,70)</text>

  <!-- Branch A: Indício de anomalia (PP02a) -->
  <rect x="625" y="95" width="205" height="82" class="node-alert"/>
  <rect x="683" y="83" width="88" height="18" class="badge-bg"/>
  <text x="727" y="96" class="badge" text-anchor="middle">Estado PP02a</text>
  <text x="727" y="125" class="txt-main" fill="#b71c1c">Indício de anomalia</text>
  <text x="727" y="145" class="txt-sub">Conferir região destacada</text>
  <text x="727" y="162" class="txt-sub">(tracejado + mapa de calor)</text>

  <!-- Branch B: Sem indício (PP02b) -->
  <rect x="625" y="265" width="205" height="82" class="node-ok"/>
  <rect x="683" y="253" width="88" height="18" class="badge-bg"/>
  <text x="727" y="266" class="badge" text-anchor="middle">Estado PP02b</text>
  <text x="727" y="295" class="txt-main" fill="#1b5e20">Sem indício (&lt; 70%)</text>
  <text x="727" y="315" class="txt-sub">Varredura visual rápida</text>
  <text x="727" y="332" class="txt-sub">em toda a extensão (T02-M1)</text>

  <!-- Step 4: Ajustes e ferramentas (PP03) -->
  <rect x="885" y="165" width="210" height="110" class="node-box"/>
  <rect x="948" y="153" width="84" height="18" class="badge-bg"/>
  <text x="990" y="166" class="badge" text-anchor="middle">Estado PP03</text>
  <text x="990" y="193" class="txt-main">Ajustes e ferramentas</text>
  <text x="990" y="213" class="txt-sub">Penetração, realce, faixa,</text>
  <text x="990" y="230" class="txt-sub">lupa e "Segure para</text>
  <text x="990" y="247" class="txt-sub">comparar (C)" (H30, RC09)</text>
  <text x="990" y="264" class="txt-sub">[Canvas local sem re-inferência]</text>

  <!-- Step 5: Marcar regiões e comentar (PP04) -->
  <rect x="1140" y="165" width="185" height="110" class="node-box"/>
  <rect x="1190" y="153" width="84" height="18" class="badge-bg"/>
  <text x="1232" y="166" class="badge" text-anchor="middle">Estado PP04</text>
  <text x="1232" y="195" class="txt-main">Marcar regiões</text>
  <text x="1232" y="213" class="txt-main">e comentar</text>
  <text x="1232" y="233" class="txt-sub">Ferramenta "Marcar"</text>
  <text x="1232" y="250" class="txt-sub">Região 1 + comentário</text>
  <text x="1232" y="266" class="txt-sub">próprio (R03, T01-3.2)</text>

  <!-- Step 6: Veredito diamond (PP05) -->
  <polygon points="1232,340 1325,410 1232,480 1140,410" class="node-diamond-orange"/>
  <rect x="1190" y="325" width="84" height="18" class="badge-bg"/>
  <text x="1232" y="338" class="badge" text-anchor="middle">Estado PP05</text>
  <text x="1232" y="398" class="txt-main">Veredito final</text>
  <text x="1232" y="416" class="txt-sub">Liberar carga ou</text>
  <text x="1232" y="432" class="txt-sub">Inspeção física (H39)</text>

  <!-- Step 7: Inspetor + observações (PP05) -->
  <rect x="885" y="365" width="210" height="90" class="node-box"/>
  <rect x="942" y="353" width="96" height="18" class="badge-bg"/>
  <text x="990" y="366" class="badge" text-anchor="middle">Estado PP05b</text>
  <text x="990" y="396" class="txt-main">Inspetor + observações</text>
  <text x="990" y="416" class="txt-sub">Identificação do responsável</text>
  <text x="990" y="434" class="txt-sub">e síntese técnica (H17, RC04)</text>

  <!-- Step 8: Laudo em PDF (PP05c) -->
  <ellipse cx="727" cy="410" rx="95" ry="44" class="node-oval"/>
  <rect x="679" y="350" width="96" height="18" class="badge-bg"/>
  <text x="727" y="363" class="badge" text-anchor="middle">Estado PP05c</text>
  <text x="727" y="405" class="txt-main">Baixar laudo em PDF</text>
  <text x="727" y="424" class="txt-sub">Imagem + recortes + parecer</text>

  <!-- Step 9: Estados de Erro / Prevenção (PP06) -->
  <rect x="205" y="365" width="370" height="95" class="node-err"/>
  <rect x="330" y="353" width="120" height="18" class="badge-err-bg"/>
  <text x="390" y="366" class="badge" text-anchor="middle">Estados PP06a / PP06b</text>
  <text x="390" y="393" class="txt-main" fill="#581c87">Prevenção de erro e recuperação</text>
  <text x="390" y="413" class="txt-sub">PP06a: Arquivo inválido ou servidor local indisponível ao abrir</text>
  <text x="390" y="430" class="txt-sub">PP06b: Tentar emitir laudo de Inspeção física sem região/observação</text>
  <text x="390" y="447" class="txt-sub">ou Liberar carga mantendo região crítica sem justificativa (H08, H12)</text>

  <!-- Edges -->
  <line x1="163" y1="220" x2="203" y2="220" class="edge"/>
  <line x1="390" y1="220" x2="423" y2="220" class="edge"/>

  <!-- Diamond to Indício (sim) -->
  <path d="M 538 188 L 538 136 L 623 136" class="edge"/>
  <text x="565" y="128" class="edge-lbl" fill="#b71c1c">sim (≥ 70%)</text>

  <!-- Diamond to Sem indício (não) -->
  <path d="M 538 252 L 538 306 L 623 306" class="edge"/>
  <text x="565" y="298" class="edge-lbl" fill="#1b5e20">não (&lt; 70%)</text>

  <!-- Indício & Sem indício to Ajustes -->
  <path d="M 830 136 L 858 136 L 858 205 L 883 205" class="edge"/>
  <path d="M 830 306 L 858 306 L 858 235 L 883 235" class="edge"/>

  <!-- Ajustes to Marcar -->
  <line x1="1095" y1="220" x2="1138" y2="220" class="edge"/>

  <!-- Marcar to Veredito -->
  <line x1="1232" y1="275" x2="1232" y2="323" class="edge"/>

  <!-- Veredito to Inspetor + observações -->
  <line x1="1140" y1="410" x2="1097" y2="410" class="edge"/>

  <!-- Inspetor to Laudo PDF -->
  <line x1="885" y1="410" x2="824" y2="410" class="edge"/>

  <!-- Error/Return edges -->
  <path d="M 95 262 L 95 412 L 203 412" class="edge-ret"/>
  <text x="104" y="345" class="edge-lbl" fill="#7e22ce">falha no arquivo</text>

  <path d="M 990 455 L 990 492 L 390 492 L 390 462" class="edge-ret"/>
  <text x="690" y="485" class="edge-lbl" fill="#7e22ce">bloqueio por falta de justificativa/região ou retorno à revisão</text>

  <path d="M 575 390 L 930 390 L 930 277" class="edge-ret"/>
  <text x="740" y="383" class="edge-lbl" fill="#7e22ce">Voltar ao exame (PP03/PP04)</text>

  <!-- Footer Note from tldraw page 2 -->
  <rect x="36" y="525" width="1288" height="58" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" rx="6"/>
  <text x="52" y="548" class="footer" font-style="normal" font-weight="700" fill="#1e293b">Regra central do fluxo (nota original da Página 3 do tldraw):</text>
  <text x="52" y="569" class="footer">"O modelo só faz a triagem: a decisão é sempre do inspetor. Marcações, comentários, veredito e observações vão para o laudo com a probabilidade e o limiar usados."</text>
</svg>
