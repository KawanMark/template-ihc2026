<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="headerPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="720" fill="url(#bgGrad)"/>

  <!-- Top Title Banner -->
  <rect x="25" y="20" width="950" height="55" rx="10" fill="url(#headerPill)"/>
  <text x="500" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">MAPA DE EMPATIA — PERSONA PRIMÁRIA P01</text>
  <text x="500" y="64" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#93c5fd">Gustavo Onofre • 46 anos • Fiscal Aduaneiro / Operador de Scanner de Raio-X Portuário</text>

  <!-- Central Persona Circle / Card -->
  <g transform="translate(500, 240)">
    <circle cx="0" cy="0" r="62" fill="#1e293b" stroke="#3b82f6" stroke-width="4" filter="url(#cardShadow)"/>
    <circle cx="0" cy="-14" r="22" fill="#60a5fa"/>
    <path d="M-28 32 C-28 8 28 8 28 32 Z" fill="#60a5fa"/>
    <rect x="-65" y="44" width="130" height="24" rx="12" fill="#2563eb"/>
    <text x="0" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">GUSTAVO ONOFRE</text>
  </g>

  <!-- 1. O QUE PENSA E SENTE? (Topo Central) -->
  <g transform="translate(260, 90)" filter="url(#cardShadow)">
    <rect width="480" height="85" rx="8" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="480" height="26" rx="8" fill="#e0e7ff"/>
    <text x="240" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#312e81">🧠 1. O QUE PENSA E SENTE?</text>
    <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• "Não posso travar o porto por falso alarme, mas não posso deixar passar ilícito na madrugada."</text>
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Tensão psicológica pela responsabilidade funcional e medo de falsos negativos sob fadiga ocular.</text>
    <text x="16" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Deseja que a IA seja uma aliada transparente e explicável, sem tirar sua autoridade decisória.</text>
  </g>

  <!-- 2. O QUE VÊ? (Esquerda) -->
  <g transform="translate(25, 130)" filter="url(#cardShadow)">
    <rect width="320" height="195" rx="8" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="26" rx="8" fill="#dbeafe"/>
    <text x="160" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">👀 2. O QUE VÊ?</text>
    <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#334155">No ambiente de trabalho:</text>
    <text x="14" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Sala de controle escura (penumbra) para leitura de tela.</text>
    <text x="14" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Monitor dedicado 24" exibindo radiografias complexas.</text>
    <text x="14" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Fila contínua de carretas nos portais de escaneamento.</text>
    <text x="14" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#334155">No mercado e ferramentas atuais:</text>
    <text x="14" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Softwares de scanners com interfaces densas e legadas.</text>
    <text x="14" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Telas brancas que causam ofuscamento na escuridão.</text>
    <text x="14" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Ausência de fila priorizada automaticamente por risco.</text>
  </g>

  <!-- 3. O QUE OUVE? (Direita) -->
  <g transform="translate(655, 130)" filter="url(#cardShadow)">
    <rect width="320" height="195" rx="8" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="26" rx="8" fill="#dbeafe"/>
    <text x="160" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">👂 3. O QUE OUVE?</text>
    <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#334155">Da chefia e supervisão:</text>
    <text x="14" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• "Agilizem a triagem, não podemos reter carretas na via."</text>
    <text x="14" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• "Mantenham rigor total: risco de sindicância por omissão."</text>
    <text x="14" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#334155">Da Polícia e Inteligência:</text>
    <text x="14" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Alertas de novas táticas de camuflagem (blindagem/chumbo).</text>
    <text x="14" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#334155">Do pátio portuário:</text>
    <text x="14" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Sirenes, rádio da fiscalização e ruído constante de carretas.</text>
  </g>

  <!-- 4. O QUE DIZ E FAZ? (Meio Inferior) -->
  <g transform="translate(240, 345)" filter="url(#cardShadow)">
    <rect width="520" height="95" rx="8" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="26" rx="8" fill="#fef3c7"/>
    <text x="260" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#92400e">💬 4. O QUE DIZ E FAZ?</text>
    <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Diz: "Essa densidade no fundo do palete não bate com o manifesto; deixa eu conferir o Zeff."</text>
    <text x="16" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Opera rapidamente via teclas de atalho (zoom, contraste e inversão) sem tirar a mão do teclado.</text>
    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Em caso de dúvida crítica na madrugada, chama um fiscal colega para um segundo olhar confirmatório.</text>
  </g>

  <!-- 5. DORES (Inferior Esquerdo) -->
  <g transform="translate(25, 460)" filter="url(#cardShadow)">
    <rect width="460" height="235" rx="8" fill="url(#cardGrad)" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="0" y="0" width="460" height="28" rx="8" fill="#fee2e2"/>
    <text x="230" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">⚠️ 5. DORES E FRUSTRAÇÕES</text>
    <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">• Fadiga visual severa e exaustão ocular:</text>
    <text x="28" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">Plantões noturnos de 12h examinando centenas de matrizes radiográficas densas.</text>
    <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">• Alto custo pessoal e penal do erro:</text>
    <text x="28" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">Pavor de falsos negativos (liberar contrabando) e desgaste por falsos positivos.</text>
    <text x="16" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">• Poluição visual e perda de contexto:</text>
    <text x="28" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">Softwares que cobrem a imagem com caixas opacas e anulam as cores de Zeff.</text>
    <text x="16" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">• Fragmentação e retrabalho de sistemas:</text>
    <text x="28" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">Ter que olhar a imagem em um console e lançar a decisão manualmente no Siscomex.</text>
    <text x="16" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">• Pressão temporal contínua:</text>
    <text x="28" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">Gargalo logístico e formação de filas de carretas caso a decisão demore.</text>
  </g>

  <!-- 6. GANHOS E NECESSIDADES (Inferior Direito) -->
  <g transform="translate(515, 460)" filter="url(#cardShadow)">
    <rect width="460" height="235" rx="8" fill="url(#cardGrad)" stroke="#86efac" stroke-width="1.5"/>
    <rect x="0" y="0" width="460" height="28" rx="8" fill="#dcfce7"/>
    <text x="230" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#166534">🎯 6. GANHOS E NECESSIDADES</text>
    <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#15803d">• Fila de trabalho ordenada por risco da IA (4 canais):</text>
    <text x="28" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">Saber exatamente quais contêineres inspecionar com máxima atenção prioritária.</text>
    <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#15803d">• Visualização com slider suave de opacidade (0–100%):</text>
    <text x="28" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">Inspecionar a anomalia residual sem perder a discriminação de material (Zeff).</text>
    <text x="16" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#15803d">• Tema Dark Mode profissional de alto contraste:</text>
    <text x="28" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">Minimizar a fadiga ocular na sala de controle em penumbra.</text>
    <text x="16" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#15803d">• Veredito rápido com justificativas pré-formatadas:</text>
    <text x="28" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">Formalizar despachos em poucos cliques, vinculando sua matrícula funcional.</text>
    <text x="16" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#15803d">• Consulta integrada aos dados do manifesto:</text>
    <text x="28" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">Validar na mesma tela o tipo de carga declarada, peso e importador.</text>
  </g>
</svg>