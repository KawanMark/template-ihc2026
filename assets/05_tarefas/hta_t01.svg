<text x="1078.0" y="92" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start">1 &gt; 2 &gt; 3 &gt; 4. Se 2 não apresentar dúvida visual: 3 pode ser</text>
<text x="1078.0" y="108" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start">dispensado e segue direto para 4.1. Se 3 mantiver dúvida após</text>
<text x="1078.0" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start">esgotar comparações, concluir sob incerteza em 4 (pesar H12).</text>

