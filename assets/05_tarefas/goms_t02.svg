<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="600" viewBox="0 0 1410 600" font-family="DejaVu Sans, Arial, sans-serif">
  <title>GOMS T02, situação atual: examinar a imagem de um contêiner e concluir se há motivo para apontar suspeita (P01, CP01)</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="1410" height="600" fill="#ffffff"/>

  <!-- G0 -->
  <rect x="470" y="12" width="470" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="705" y="36" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">G0: Concluir se há motivo para apontar suspeita</text>
  <text x="705" y="58" text-anchor="middle" font-size="13" fill="#0d47a1">M0: G1 &gt;&gt; G2 &gt;&gt; G3 (G2 pode ser dispensada se G1 não deixar dúvida)</text>

  <path d="M600,74 L235,108" stroke="#37474f" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M705,74 L760,108" stroke="#37474f" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M800,74 L1230,108" stroke="#37474f" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- Goals -->
  <rect x="30" y="110" width="410" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="235" y="132" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b5e20">G1: Examinar a imagem e identificar</text>
  <text x="235" y="150" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b5e20">regiões de dúvida</text>

  <rect x="480" y="110" width="560" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="760" y="132" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b5e20">G2: Confrontar a região em dúvida</text>
  <text x="760" y="150" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b5e20">com a carga declarada</text>

  <rect x="1080" y="110" width="300" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1230" y="132" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b5e20">G3: Decidir se</text>
  <text x="1230" y="150" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b5e20">aponta suspeita</text>

  <path d="M440,136 L480,136" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M1040,136 L1080,136" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Selection rules -->
  <rect x="30" y="196" width="410" height="40" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="235" y="213" text-anchor="middle" font-size="12" fill="#546e7a">Método único: não há outro sustentado</text>
  <text x="235" y="229" text-anchor="middle" font-size="12" fill="#546e7a">para G1, então não há regra de seleção</text>

  <rect x="480" y="196" width="560" height="40" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="760" y="213" text-anchor="middle" font-size="12" fill="#5d4037"><tspan font-weight="bold">SR1:</tspan> M2 se a estação mostra os dados da declaração;</text>
  <text x="760" y="229" text-anchor="middle" font-size="12" fill="#5d4037">M3 se não mostra</text>

  <rect x="1080" y="196" width="300" height="40" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="1230" y="213" text-anchor="middle" font-size="12" fill="#5d4037"><tspan font-weight="bold">SR2:</tspan> critérios de decisão</text>
  <text x="1230" y="229" text-anchor="middle" font-size="12" fill="#5d4037">(compatível, incompatível, dúvida)</text>

  <path d="M235,162 L235,196" stroke="#37474f" stroke-width="1.2" fill="none"/>
  <path d="M760,162 L760,196" stroke="#37474f" stroke-width="1.2" fill="none"/>
  <path d="M1230,162 L1230,196" stroke="#37474f" stroke-width="1.2" fill="none"/>

  <path d="M235,236 L235,268" stroke="#37474f" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M617,236 L617,268" stroke="#37474f" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M903,236 L903,268" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6,4" fill="none" marker-end="url(#ar)"/>
  <path d="M1230,236 L1230,268" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6,4" fill="none" marker-end="url(#ar)"/>

  <!-- M1 (fato) -->
  <rect x="30" y="270" width="410" height="250" rx="6" fill="#fafafa" stroke="#37474f" stroke-width="2"/>
  <text font-size="12" fill="#212121">
    <tspan x="42" y="292" font-weight="bold" font-size="13.5">M1: exame direto, com os tratamentos do software  [F]</tspan>
    <tspan x="42" y="320">1 Perceber a imagem inteira e as cores por material</tspan>
    <tspan x="42" y="344">2 Varrer a imagem em busca de região que difere</tspan>
    <tspan x="42" y="360">   do esperado</tspan>
    <tspan x="42" y="384">3 Para cada região em dúvida, repetir:</tspan>
    <tspan x="42" y="400">   ampliar e deslocar; ajustar contraste e brilho;</tspan>
    <tspan x="42" y="416">   ligar o realce de bordas; alternar pseudo-cor ou</tspan>
    <tspan x="42" y="432">   inversão e comparar com a original, até dizer se</tspan>
    <tspan x="42" y="448">   é carga ou esgotar os tratamentos</tspan>
    <tspan x="42" y="472">4 Reter as regiões ainda em dúvida</tspan>
  </text>

  <!-- M2 -->
  <rect x="480" y="270" width="275" height="250" rx="6" fill="#fafafa" stroke="#37474f" stroke-width="2"/>
  <text font-size="12" fill="#212121">
    <tspan x="491" y="292" font-weight="bold" font-size="13.5">M2: dados na estação  [F]</tspan>
    <tspan x="491" y="320">1 Ler a descrição e a natureza</tspan>
    <tspan x="491" y="336">   da carga declarada</tspan>
    <tspan x="491" y="360">2 Recordar o que essa carga</tspan>
    <tspan x="491" y="376">   deveria mostrar na imagem</tspan>
    <tspan x="491" y="400">3 Comparar a região com isso</tspan>
    <tspan x="491" y="436" fill="#6d4c41">Campo de produtos no software [F]</tspan>
    <tspan x="491" y="452" fill="#6d4c41">(C03); na unidade de P01 [?]</tspan>
  </text>

  <!-- M3 -->
  <rect x="765" y="270" width="275" height="250" rx="6" fill="#fafafa" stroke="#37474f" stroke-width="2" stroke-dasharray="8,5"/>
  <text font-size="12" fill="#212121">
    <tspan x="776" y="292" font-weight="bold" font-size="13.5">M3: fora da estação  [H]</tspan>
    <tspan x="776" y="320">1 Abrir a declaração em outro</tspan>
    <tspan x="776" y="336">   sistema</tspan>
    <tspan x="776" y="360">2 Ler e reter a descrição</tspan>
    <tspan x="776" y="384">3 Voltar à imagem e comparar</tspan>
    <tspan x="776" y="420" fill="#6d4c41">Carga de memória e troca de</tspan>
    <tspan x="776" y="436" fill="#6d4c41">sistema (H11), a confirmar</tspan>
  </text>

  <!-- M4 -->
  <rect x="1080" y="270" width="300" height="250" rx="6" fill="#fafafa" stroke="#37474f" stroke-width="2" stroke-dasharray="8,5"/>
  <text font-size="12" fill="#212121">
    <tspan x="1091" y="292" font-weight="bold" font-size="13.5">M4: avaliar e concluir  [H]</tspan>
    <tspan x="1091" y="320">1 Avaliar se a região é compatível</tspan>
    <tspan x="1091" y="336">   com a carga</tspan>
    <tspan x="1091" y="360">2 Compatível: concluir "não apontar"</tspan>
    <tspan x="1091" y="380">3 Incompatível: concluir "apontar"</tspan>
    <tspan x="1091" y="400">4 Dúvida persiste: [?] pedir segunda</tspan>
    <tspan x="1091" y="416">   opinião, ou concluir sob incerteza</tspan>
    <tspan x="1091" y="432">   pesando o custo de errar (H12)</tspan>
    <tspan x="1091" y="468" fill="#6d4c41">Fim: a conclusão segue para o</tspan>
    <tspan x="1091" y="484" fill="#6d4c41">registro (A03, não modelado)</tspan>
  </text>

  <!-- Legend -->
  <rect x="30" y="548" width="1350" height="40" rx="6" fill="#f5f5f5" stroke="#bdbdbd"/>
  <rect x="45" y="559" width="34" height="18" fill="#fafafa" stroke="#37474f" stroke-width="2"/>
  <text x="88" y="573" font-size="12" fill="#212121">linha contínua: baseado em fato [F]</text>
  <rect x="340" y="559" width="34" height="18" fill="#fafafa" stroke="#37474f" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="383" y="573" font-size="12" fill="#212121">tracejada: hipótese sobre o trabalho atual [H], a confirmar na Entrega 7</text>
  <rect x="800" y="559" width="34" height="18" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="843" y="573" font-size="12" fill="#212121">Goal</text>
  <rect x="900" y="559" width="34" height="18" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="943" y="573" font-size="12" fill="#212121">Selection Rule</text>
  <text x="1060" y="573" font-size="12" fill="#212121">Passos = operadores no nível da ação do usuário</text>
</svg>
