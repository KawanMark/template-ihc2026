<svg xmlns="http://www.w3.org/2000/svg" width="940" height="980" viewBox="0 0 940 980" role="img" aria-labelledby="t"><title id="t">Processo da avaliação heurística</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#29455f"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172c40;font-size:20px}.a{fill:none;stroke:#29455f;stroke-width:2;marker-end:url(#a)}</style>
<text x="30" y="40" font-size="27" font-weight="bold">Processo da avaliação heurística</text>
<rect x="45" y="85" width="675" height="90" rx="14" fill="#f1f4f7" stroke="#526476"/><text x="65" y="117" font-weight="bold">1. Preparação</text><text x="65" y="149" font-size="18">Congelar versão, conhecer usuários/tarefas e definir escopo.</text>
<path class="a" d="M380 175 V220"/>
<rect x="45" y="220" width="675" height="90" rx="14" fill="#f1f4f7" stroke="#526476"/><text x="65" y="252" font-weight="bold">2. Coleta individual</text><text x="65" y="284" font-size="18">Cada integrante percorre todos os estados; não discute achados.</text>
<path class="a" d="M380 310 V355"/>
<rect x="45" y="355" width="675" height="90" rx="14" fill="#f1f4f7" stroke="#526476"/><text x="65" y="387" font-weight="bold">3. Interpretação</text><text x="65" y="419" font-size="18">Aplicar H1–H10; localizar problema e reunir print destacado.</text>
<path class="a" d="M380 445 V490"/>
<rect x="45" y="490" width="675" height="90" rx="14" fill="#f1f4f7" stroke="#526476"/><text x="65" y="522" font-weight="bold">4. Severidade</text><text x="65" y="554" font-size="18">Justificar frequência, impacto e persistência; propor correção.</text>
<path class="a" d="M380 580 V625"/>
<rect x="45" y="625" width="675" height="90" rx="14" fill="#f1f4f7" stroke="#526476"/><text x="65" y="657" font-weight="bold">5. Consolidação</text><text x="65" y="689" font-size="18">Reunir duplicados preservando autoria e definir prioridades.</text>
<path class="a" d="M380 715 V760"/>
<rect x="45" y="760" width="675" height="90" rx="14" fill="#f1f4f7" stroke="#526476"/><text x="65" y="792" font-weight="bold">6. Relato e revisão</text><text x="65" y="824" font-size="18">Publicar síntese, corrigir e reinspecionar os fluxos afetados.</text>
<path class="a" stroke-dasharray="7 5" d="M720 805 H900 V130 H720"/><text x="750" y="772" font-size="17">Reavaliar</text><text x="45" y="955" font-size="18">O ciclo retorna à preparação com nova versão; as três inspeções ainda não foram executadas.</text></svg>