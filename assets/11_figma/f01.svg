<text x="32" y="118" class="h1">F01 — Abrir um caso</text>
<text x="32" y="151" class="muted">Caso DEMO-001  |  Carga declarada: volumes industriais (fictício)</text>
<text x="32" y="937" class="small muted">Apoio à análise da imagem. Não confirma ilícito e não autoriza desembaraço.</text>
<rect x="32" y="184" width="1376" height="695" rx="10" fill="#ffffff" stroke="none"/>
<text x="72" y="235" class="h2">Conferir imagem e identificação</text>
<text x="72" y="276" class="">Um caso por vez. A imagem original será preservada.</text>
<text x="72" y="303" class="">Utilize apenas dados fictícios ou imagens autorizadas.</text>
<rect x="72" y="345" width="800" height="230" rx="10" fill="#f1f4f7" stroke="#a6b4c1"/>
<text x="102" y="399" class="label">Imagem de raio-X</text>
<text x="102" y="437" class="muted">PNG ou JPEG • formato verificado antes da análise</text>
<text x="102" y="464" class="muted">Nenhuma imagem selecionada.</text>
<rect x="102" y="503" width="210" height="44" rx="10" fill="#185e95" stroke="#185e95"/>
<text x="118" y="531" class="white">Selecionar imagem</text>
<text x="72" y="634" class="label">Identificação do caso *</text>
<rect x="72" y="652" width="480" height="50" rx="10" fill="#fff" stroke="#526476"/>
<text x="88" y="684" class="">DEMO-001</text>
<text x="620" y="634" class="label">Carga declarada</text>
<rect x="620" y="652" width="650" height="50" rx="10" fill="#fff" stroke="#526476"/>
<text x="636" y="684" class="">Volumes industriais (exemplo fictício)</text>
<rect x="72" y="752" width="180" height="44" rx="10" fill="#185e95" stroke="#185e95"/>
<text x="88" y="780" class="white">Abrir caso</text>
