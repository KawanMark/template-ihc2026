<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="t d"><title id="t">F01 — Abrir um caso</title><desc id="d">Prancha editável da Mesa de inspeção. Dados demonstrativos; controles ainda sem conexões no Figma.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172c40;font-size:18px}.h1{font-size:30px;font-weight:bold}.h2{font-size:22px;font-weight:bold}.muted{fill:#526476}.white{fill:white}.small{font-size:16px}.label{font-weight:bold}</style>
<rect x="0" y="0" width="1440" height="960" rx="0" fill="#f1f4f7" stroke="none"/>
